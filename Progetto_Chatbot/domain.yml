version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - bot_challenge
  - bot_abilities
  - search_game


entities:
  - game_title
  - genre
  - platform

slots:
  game_title:
    type: text
    mappings:
      - type: from_entity
        entity: game_title
  genre:
    type: text
    mappings:
      - type: from_entity
        entity: genre
  platform:
    type: text
    mappings:
      - type: from_entity
        entity: platform

responses:
  utter_greet:
    - text: "Hi! I'm GameGuru. Your personal game assistant! How can i help you?"
  
  utter_bot_abilities:
    - text: "Hi! I'm your game assistant. Here's what i can do for you: 
            \n - I can help you find games." 
  
  utter_goodbye:
    - text: "Goodbye! Have a nice day!"

  utter_iamabot:
    - text: "I am a bot, powered by Rasa."

  utter_out_of_scope:
    - text: "I'm sorry, I can't help you with that."

  utter_fallback:
    # - buttons:
    #   - title: geo-joke
    #     payload: /geo-joke
    #   - title: geo-curiosity
    #     payload: /geo-curiosity
    - text: Sorry! I couldn't get you! Please use one of the following options.
actions:
  - action_search_game
  - action_my_fallback

config:
  store_entities_as_slots: true
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
