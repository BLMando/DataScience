version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  condition:
  - active_loop: null
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Explain bot abilities
  steps:
  - intent: bot_abilities
  - action: utter_bot_abilities

- rule: Handle out of scope
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope

- rule: Ask the user to rephrase whenever they send a message with low NLU confidence
  steps:
  - intent: nlu_fallback
  - action: utter_fallback

- rule: Handle core fallback
  steps:
  - action: action_my_fallback
  - action: action_listen

- rule: Activate game search form
  steps:
  - intent: search_game
  - action: game_search_form
  - active_loop: game_search_form

- rule: Submit game search form
  condition:
  - active_loop: game_search_form
  steps:
  - action: game_search_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: utter_submit_game_search_form
  - action: action_recommend_games

- rule: Direct game search by name (interrupts form)
  condition:
  - active_loop: game_search_form
  steps:
  - intent: search_game_by_name
  - active_loop: null
  - action: action_search_game_by_name

- rule: Search game by name
  condition:
  - active_loop: null
  steps:
  - intent: search_game_by_name
  - action: action_search_game_by_name

- rule: Show game details
  steps:
  - intent: game_details
  - action: action_game_details

- rule: Handle deny after search
  condition:
  - active_loop: null
  steps:
  - intent: deny
  - action: utter_deny_details

# =========================================================================
# FORM INTERRUPTIONS (handle and resume)
# =========================================================================

- rule: Form Interruption - Bot Challenge
  condition:
  - active_loop: game_search_form
  steps:
  - intent: bot_challenge
  - action: utter_iamabot
  - action: game_search_form
  - active_loop: game_search_form

- rule: Form Interruption - Greet
  condition:
  - active_loop: game_search_form
  steps:
  - intent: greet
  - action: utter_greet
  - action: game_search_form
  - active_loop: game_search_form

- rule: Form Interruption - Bot Abilities
  condition:
  - active_loop: game_search_form
  steps:
  - intent: bot_abilities
  - action: utter_bot_abilities
  - action: game_search_form
  - active_loop: game_search_form

- rule: Form Interruption - Goodbye (exit form)
  condition:
  - active_loop: game_search_form
  steps:
  - intent: goodbye
  - action: utter_goodbye
  - active_loop: null
  - action: action_deactivate_loop

- rule: Form Interruption - Search by Name (exit form)
  condition:
  - active_loop: game_search_form
  steps:
  - intent: search_game_by_name
  - action: action_search_game_by_name
  - action: game_search_form

- rule: Form Unhappy Path - Invalid Input
  condition:
  - active_loop: game_search_form
  steps:
  - action: game_search_form
  - active_loop: game_search_form

- rule: Handle Skip outside form
  condition:
  - active_loop: null
  steps:
  - intent: skip
  - action: utter_fallback

