version: "3.1"

rules:
  # =========================================================================
  # GENERAL CHIT-CHAT & UTILITIES
  # =========================================================================

  - rule: Say goodbye anytime the user says goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye
      - active_loop: null

  - rule: Respond to greeting
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say 'I am a bot' anytime the user challenges
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  - rule: Explain bot abilities
    steps:
      - intent: bot_abilities
      - action: utter_bot_abilities

  - rule: Handle out of scope
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope

  # =========================================================================
  # FALLBACKS
  # =========================================================================

  - rule: Ask the user to rephrase (NLU Fallback)
    steps:
      - intent: nlu_fallback
      - action: utter_fallback

  - rule: Handle core fallback
    steps:
      - action: action_my_fallback
      - action: action_listen

  # =========================================================================
  # GAME SEARCH FORM (Happy Paths)
  # =========================================================================

  - rule: Activate game search form
    steps:
      - intent: search_game
      - action: game_search_form
      - active_loop: game_search_form

  - rule: Submit game search form
    condition:
      - active_loop: game_search_form
    steps:
      - action: game_search_form
      - active_loop: null
      - action: utter_submit_game_search_form
      - action: action_recommend_games

  # ========================================================================
  # COMPATIBILITY CHECK
  # ========================================================================
  - rule: Check compatibility for game (no form active)
    condition:
      - active_loop: null
    steps:
      - intent: check_compatibility_with_platform
      - action: action_check_compatibility
      - action: action_listen

  - rule: Check compatibility for game (interrupts the game_search_form and resumes)
    condition:
      - active_loop: game_search_form
    steps:
      - intent: check_compatibility_with_platform
      - action: action_check_compatibility
      - action: game_search_form
      - active_loop: game_search_form

  # =========================================================================
  # ONE-OFF SEARCH & DETAILS (No Form)
  # =========================================================================

  - rule: Search game by name (General)
    condition:
      - active_loop: null
    steps:
      - intent: search_game_by_name
      - action: action_search_game_by_name

  - rule: Show game details
    steps:
      - intent: game_details
      - action: action_game_details

  - rule: Handle deny after search
    condition:
      - active_loop: null
    steps:
      - intent: deny
      - action: utter_deny_details

  - rule: Search DLCs for a game
    steps:
      - intent: fetch_dlcs_and_editions
      - action: action_game_dlc

  - rule: Fetch game series
    steps:
      - intent: fetch_game_series
      - action: action_fetch_game_series

  # =========================================================================
  # FORM INTERRUPTIONS (Crucial Logic)
  # =========================================================================

  - rule: Direct game search by name (interrupts and kills form)
    condition:
      - active_loop: game_search_form
    steps:
      - intent: search_game_by_name
      - active_loop: null
      - action: action_search_game_by_name

  - rule: Form Interruption - Bot Challenge
    condition:
      - active_loop: game_search_form
    steps:
      - intent: bot_challenge
      - action: utter_iamabot
      - action: game_search_form
      - active_loop: game_search_form

  - rule: Form Interruption - Greet
    condition:
      - active_loop: game_search_form
    steps:
      - intent: greet
      - action: utter_greet
      - action: game_search_form
      - active_loop: game_search_form

  - rule: Form Interruption - Bot Abilities
    condition:
      - active_loop: game_search_form
    steps:
      - intent: bot_abilities
      - action: utter_bot_abilities
      - action: game_search_form
      - active_loop: game_search_form

  - rule: Handle Skip outside form
    condition:
      - active_loop: null
    steps:
      - intent: skip
      - action: utter_fallback

  # =========================================================================
  # INFORMAL UTTERANCES AND FALLBACKS EXPECTED BY ACTIONS
  # =========================================================================


  - rule: Ask to show details after recommendations
    steps:
      - action: action_recommend_games
      - action: utter_ask_game_details



